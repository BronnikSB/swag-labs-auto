name: Test

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: action/checkout@v4

      - name: Setup Python
        uses: action/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest