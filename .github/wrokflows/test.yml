name: Test

on:
  push:
    branches: [ main ]

  pusll_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        users: action/checkout@v4

      - name: Setup Python
        users: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Run tests
        run: pytest